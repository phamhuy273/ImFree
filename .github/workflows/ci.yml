name: ImFree CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-check:
    name: Kiểm tra Backend (NestJS Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imfree-backend
    steps:
      - name: Kéo code về máy ảo
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: imfree-backend/package-lock.json

      - name: Cài đặt thư viện Backend
        run: npm ci

      - name: Biên dịch thử code Backend
        run: npm run build

  mobile-check:
    name: Kiểm tra Mobile (Flutter Analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imfree-mobile
    steps:
      - name: Kéo code về máy ảo
        uses: actions/checkout@v4

      - name: Cài đặt Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cài đặt thư viện Flutter
        run: flutter pub get

      - name: Kiểm tra cú pháp mã nguồn Flutter
        run: flutter analyze